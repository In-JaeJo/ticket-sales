name: Claude 리뷰

# PR을 열 때와 PR 브랜치에 새 커밋을 올릴 때 Claude가 리뷰 댓글을 단다.
# 필요한 것: Claude GitHub 앱 설치, 저장소 Secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token으로 발급)
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# 같은 PR에 연달아 push하면 이전 리뷰를 취소하고 마지막 커밋만 리뷰한다
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude 코드 리뷰
    # Draft PR은 건너뛰고, Ready for review로 바꿀 때 리뷰한다
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 규칙 자체는 CLAUDE.md(요약)와 ARCHITECTURE.md 8장(원본)에 있다. 여기서는 리뷰 방식만 정한다.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR의 변경 내용을 리뷰해줘.

            ## 리뷰 전에 할 일
            1. `gh pr view`로 PR 제목과 설명을 읽고 이 변경의 목적을 파악한다.
            2. `gh pr view --comments`로 기존 리뷰 댓글을 확인한다. 이미 지적한 내용은 다시 달지 않는다.
               이전 리뷰 뒤에 새 커밋으로 고쳐진 문제는 요약 댓글에 "해결됨"으로 적는다.
            3. `gh pr diff`로 변경 내용을 본다.
            4. CLAUDE.md의 규칙 R1~R17을 확인한다. 이유가 필요하면 ARCHITECTURE.md 8장(규칙), 9장(완료 기준 테스트)을 읽는다.
            5. 변경된 함수는 정의 전체와 호출하는 곳까지 읽고 판단한다. diff 몇 줄만 보고 결론 내지 않는다.

            ## 찾을 것 (중요한 순서)
            1. 버그: 잘못된 조건, 경계값, null, 예외를 삼키는 코드, 빠진 에러 처리
            2. 규칙 위반: CLAUDE.md R1~R17 (규칙 번호를 적는다)
            3. 동시성·트랜잭션: 경쟁 조건, 트랜잭션 범위, 같은 클래스 내부 호출, 락 순서
            4. 메시지 신뢰성: Outbox를 거치지 않는 발행, 멱등 키 누락, 재처리 시 중복 반영, 판 번호(X-Run-Id)
            5. 데이터 정합성: 초과 판매, 재고 이중 복구, 상태가 안 바뀌었는데 이벤트 발행
            6. 테스트 누락: 바뀐 동작을 증명하는 테스트가 없음 (해당 T번호가 있으면 적는다)

            ## 변경이 적절한지
            - PR 설명의 목적과 실제 변경이 맞는지
            - 증상만 막은 땜질인지, 원인을 고친 것인지 판단한다.
              땜질의 예: 예외를 catch로 삼키기, 특정 값만 if로 거르기, 재시도·sleep으로 타이밍 맞추기, 테스트 기대값만 바꾸기
            - 땜질이면 원인이 어디인지와 근본 해결 방법을 제안한다.
            - 같은 원인 때문에 다른 곳에도 같은 문제가 있으면 위치를 함께 적는다.
            - 더 단순한 방법이 있는데 불필요하게 복잡해졌으면 지적한다.

            ## 지적하지 말 것
            - 포맷, 들여쓰기, import 순서, 이름 취향
            - 이 PR이 건드리지 않은 코드의 문제 (단, 이번 변경이 그 문제를 드러내거나 악화시키면 지적한다)
            - CLAUDE.md 10장의 범위 밖 기능을 넣으라는 제안 (좌석 지정, 로그인, 캐싱 등)

            ## 댓글 방식
            - 문제가 있는 줄에 인라인 댓글로 단다. 형식:
              **[심각도] 한 줄 요약**
              - 문제: 어떤 입력·상황에서 무엇이 잘못되는지
              - 이유: 왜 그런지 (규칙 위반이면 규칙 번호)
              - 해결: 고칠 방법
            - 심각도: `높음`(머지 전에 고쳐야 함) / `보통`(고치는 게 좋음) / `낮음`(참고)
            - 인라인 댓글은 코드로 확인한 확실한 문제만 단다. 최대 10개, 심각도가 높은 것부터.
            - 마지막에 `gh pr comment`로 전체 요약 댓글을 하나 남긴다.
              - 변경 목적에 맞는지, 근본 해결인지 한두 문장
              - 심각도별 개수
              - 코드만으로 확정할 수 없는 의심 사항은 인라인이 아니라 여기에 "확인 필요"로 적는다.
              - 문제가 없으면 "문제 없음" 한 줄만
            - 모든 댓글은 한글로.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
