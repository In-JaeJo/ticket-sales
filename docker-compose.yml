services:
  app:
    build: ./backend
    ports: ["8080:8080"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ticketsales
      MYSQL_PASSWORD: ticketsales
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketsales
      MYSQL_USER: ticketsales
      MYSQL_PASSWORD: ticketsales
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: ticket-sales
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  k6:
    build: ./k6
    profiles: ["load"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      BASE_URL: http://nginx
    volumes:
      - ./k6/scenarios:/scripts:ro
      - ./k6/results:/results
    depends_on: [nginx]

  # 가상 손님 실행기: 관제 화면의 투입 요청을 받아 자기 안에서 k6를 실행한다. 앱은 Docker를 제어하지 않는다.
  crowd-runner:
    build: ./k6
    entrypoint: ["/bin/sh", "/crowd-runner.sh"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      API: http://nginx
    volumes:
      - ./k6/crowd-runner.sh:/crowd-runner.sh:ro
      - ./k6/scenarios:/scripts:ro
    depends_on: [nginx]
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports: ["80:80"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticket-sales.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
