worker_processes auto;
# 대기자 1만 명이 SSE 연결을 하나씩 유지한다. 연결 수와 파일 한도를 넉넉히 잡는다.
worker_rlimit_nofile 65536;

events {
    worker_connections 20000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream app {
        server app:8080;
        keepalive 64;
    }

    server {
        listen 80;
        charset utf-8;

        # SSE: 버퍼링을 끄고 연결을 오래 유지한다
        location ~ ^/api/(queue|demo)/stream$ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /swagger-ui {
            proxy_pass http://app;
        }

        location /v3/api-docs {
            proxy_pass http://app;
        }

        # 손님·관제 화면 (frontend 빌드 결과)
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}
